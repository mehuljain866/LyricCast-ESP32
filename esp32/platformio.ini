[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    olikraus/U8g2_for_Adafruit_GFX
